services:
  app:
    build: container
    volumes:
      - './src:/data'
    networks:
      - notify
      - mysql
      - mailpit
    depends_on:
      - redis
    ports:
      - 80:80

  redis:
    image: 'redis:alpine'
    volumes:
      - './container/redis:/data'
    networks:
      - notify
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

networks:
  notify:
    driver: bridge
  mysql:
    external: true
  mailpit:
    external: true
